# Roundcube at /webmail/ (a symlink to public_html under the document root, so
# Roundcube's own .htaccess rewrites work without RewriteBase), plus /healthz.php.
# Only public_html is reachable; config/, logs/, temp/ and vendor/ are outside
# the document root and denied outright.

ServerTokens Prod
ServerSignature Off
TraceEnable Off

<VirtualHost *:80>
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    <Directory /var/www/roundcube>
        Options None
        AllowOverride None
        Require all denied
    </Directory>

    <Directory /var/www/roundcube/public_html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog /proc/self/fd/2
    LogFormat "%{X-Forwarded-For}i %h %t \"%r\" %>s %b %D" webmail
    CustomLog /proc/self/fd/1 webmail
</VirtualHost>
