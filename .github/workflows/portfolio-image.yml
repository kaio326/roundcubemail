# Builds and publishes the portfolio's Roundcube image when a portfolio release
# tag is pushed: <upstream version>-p<n>, for example 1.7.5-p1 (see PORTFOLIO.md).
name: Portfolio image

on:
  push:
    tags:
      - '*-p*'

permissions:
  contents: read

concurrency:
  group: portfolio-image-${{ github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/roundcube

jobs:
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check the tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-p[0-9]+$'; then
            echo "::error::Tag $TAG is not <upstream version>-p<n>"
            exit 1
          fi
          echo "upstream=${TAG%-p*}" >> "$GITHUB_OUTPUT"

      - name: Check the tag is on the portfolio branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${GITHUB_SHA}...portfolio" --jq .status)
          case "$status" in
            ahead|identical) ;;
            *) echo "::error::Tag commit is not on branch portfolio (compare status: $status)"; exit 1 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          build-args: |
            RC_VERSION=${{ steps.version.outputs.upstream }}
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          push: true
          provenance: mode=max
          sbom: true

      - name: Smoke test
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          docker run --rm --entrypoint php "$REF" -l /var/www/roundcube/plugins/portfolio_sso/portfolio_sso.php
          if docker run --rm -e MAIL_HOSTNAME=mail.invalid "$REF"; then
            echo "::error::The container started without its secrets"
            exit 1
          fi

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
